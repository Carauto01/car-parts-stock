<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การขาย - ระบบสต็อก</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>🛒 การขาย</h1>
    <div class="user-info">
      <span id="userDisplay">ผู้ใช้</span>
      <button class="btn btn-secondary btn-small" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <h2>🚗 ศูนย์แต่งรถ</h2>
    </div>
    <nav>
      <ul>
        <li><a href="dashboard.html">📊 แดชบอร์ด</a></li>
        <li><a href="stock.html">📦 จัดการสต็อก</a></li>
        <li><a href="sales.html" class="active">🛒 การขาย</a></li>
        <li><a href="reports.html">📋 รายงาน</a></li>
        <li id="usersMenu" style="display: none;"><a href="users.html">👤 ผู้ใช้งาน</a></li>
      </ul>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container">
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
        <!-- Product Selection -->
        <div class="card">
          <h2>📦 เลือกสินค้า</h2>
          
          <div class="form-group">
            <label>ค้นหาสินค้า</label>
            <select id="productSelect" onchange="addToCart()">
              <option value="">-- เลือกสินค้า --</option>
            </select>
          </div>

          <table class="table" id="cartTable">
            <thead>
              <tr>
                <th>สินค้า</th>
                <th class="text-right">ราคา</th>
                <th class="text-right">จำนวน</th>
                <th class="text-right">รวม</th>
                <th class="text-center">ลบ</th>
              </tr>
            </thead>
            <tbody id="cartBody">
              <tr><td colspan="5" style="text-align: center; padding: 20px; color: #999;">ยังไม่มีสินค้า</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Order Summary -->
        <div class="card">
          <h2>💰 สรุปรายการขาย</h2>

          <div style="background-color: #f5f5f5; padding: 15px; border-radius: 5px; margin-bottom: 15px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
              <span>ราคาทั้งสิ้น:</span>
              <strong id="subtotal">฿0.00</strong>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
              <span>ส่วนลด:</span>
              <input type="number" id="discount" step="0.01" value="0" 
                style="width: 80px; padding: 5px; border: 1px solid #ddd; border-radius: 3px;" onchange="calculateTotal()">
            </div>
            <div style="border-top: 2px solid #ddd; padding-top: 10px;">
              <div style="display: flex; justify-content: space-between; font-size: 18px;">
                <strong>รวมทั้งสิ้น:</strong>
                <strong id="total" style="color: #e74c3c;">฿0.00</strong>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>วิธีชำระเงิน</label>
            <select id="paymentMethod">
              <option value="cash">💵 เงินสด</option>
              <option value="card">💳 บัตรเครดิต</option>
              <option value="qr">📱 QR Code</option>
              <option value="transfer">🏦 โอนเงิน</option>
            </select>
          </div>

          <div class="form-group">
            <label for="customerName">ชื่อลูกค้า (ถ้ามี)</label>
            <input type="text" id="customerName" placeholder="ไม่บังคับ">
          </div>

          <div class="btn-group" style="flex-direction: column;">
            <button class="btn btn-primary" onclick="generateReceipt()">🧾 ออกใบเสร็จ</button>
            <button class="btn btn-warning" onclick="generatePO()">📋 ออกใบสั่งซื้อ</button>
            <button class="btn btn-secondary" onclick="clearCart()">🗑️ ล้างรายการ</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Receipt Modal -->
  <div id="receiptModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🧾 ใบเสร็จรับเงิน</h2>
        <span class="modal-close" onclick="closeModal('receiptModal')">&times;</span>
      </div>

      <div id="receiptContent" style="padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
        <!-- ใบเสร็จจะแสดงที่นี่ -->
      </div>

      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="btn btn-success" style="flex: 1;" onclick="printReceipt()">🖨️ พิมพ์</button>
        <button class="btn btn-info" style="flex: 1;" onclick="downloadReceipt()">💾 ดาวน์โหลด QR</button>
        <button class="btn btn-secondary" style="flex: 1;" onclick="closeModal('receiptModal')">ปิด</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (!getLocalUser()) {
      window.location.href = 'index.html';
    }

    const user = getLocalUser();
    document.getElementById('userDisplay').textContent = `สวัสดี, ${user.name}`;

    if (user.role === 'admin') {
      document.getElementById('usersMenu').style.display = 'block';
    }

    // สินค้าจาก store (ตรงกับหน้าจัดการสต็อก)
    let products = getProducts();

    let cart = [];

    // Load products dropdown
    function loadProducts() {
      products = getProducts();
      const select = document.getElementById('productSelect');
      select.innerHTML = '<option value="">-- เลือกสินค้า --</option>';
      products.forEach(p => {
        const soldOut = p.quantity <= 0;
        select.innerHTML += `<option value="${p.id}" ${soldOut ? 'disabled' : ''}>${p.name} (${formatCurrency(p.price)}) — เหลือ ${p.quantity}</option>`;
      });
    }

    function addToCart() {
      const productId = parseInt(document.getElementById('productSelect').value);
      if (!productId) return;

      const product = products.find(p => p.id === productId);
      if (!product) return;

      const existingItem = cart.find(item => item.id === productId);
      if (existingItem) {
        if (existingItem.quantity < product.quantity) {
          existingItem.quantity++;
        } else {
          showNotification('⚠️ สต็อกไม่พอ', 'warning');
        }
      } else {
        cart.push({
          id: product.id,
          name: product.name,
          price: product.price,
          cost: product.cost,
          quantity: 1,
          maxStock: product.quantity
        });
      }

      document.getElementById('productSelect').value = '';
      updateCart();
    }

    function updateCartItem(productId, value) {
      const quantity = parseInt(value, 10);
      const item = cart.find(i => i.id === productId);
      if (item) {
        if (quantity > 0 && quantity <= item.maxStock) {
          item.quantity = quantity;
        } else if (quantity > item.maxStock) {
          showNotification('⚠️ สต็อกไม่พอ', 'warning');
        }
      }
      updateCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCart();
    }

    function updateCart() {
      let html = '';
      let subtotal = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        html += `
          <tr>
            <td>${item.name}</td>
            <td class="text-right">${formatCurrency(item.price)}</td>
            <td class="text-right">
              <input type="number" value="${item.quantity}" min="1" max="${item.maxStock}"
                style="width: 50px; padding: 5px; border: 1px solid #ddd; border-radius: 3px;"
                onchange="updateCartItem(${item.id}, this.value)">
            </td>
            <td class="text-right">${formatCurrency(itemTotal)}</td>
            <td class="text-center">
              <button class="btn btn-danger btn-small" onclick="removeFromCart(${item.id})">✕</button>
            </td>
          </tr>
        `;
      });

      if (cart.length === 0) {
        html = '<tr><td colspan="5" style="text-align: center; padding: 20px; color: #999;">ยังไม่มีสินค้า</td></tr>';
      }

      document.getElementById('cartBody').innerHTML = html;
      document.getElementById('subtotal').textContent = formatCurrency(subtotal);
      calculateTotal();
    }

    function calculateTotal() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const total = subtotal - discount;
      document.getElementById('total').textContent = formatCurrency(Math.max(0, total));
    }

    function generateReceipt() {
      if (cart.length === 0) {
        showNotification('⚠️ ยังไม่มีสินค้าในรายการ', 'warning');
        return;
      }

      // ตัดสต็อกก่อน ถ้าของไม่พอให้ยกเลิกทั้งบิล
      const saleItems = cart.map(({ id, name, cost, price, quantity }) => ({ id, name, cost, price, quantity }));
      if (!deductStock(saleItems)) {
        showNotification('⚠️ สต็อกไม่พอ กรุณาตรวจสอบจำนวนอีกครั้ง', 'error');
        loadProducts();
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const total = subtotal - discount;
      const qrData = {
        receipt: 'SALES_' + new Date().getTime(),
        total: total,
        items: cart.length,
        date: new Date().toISOString()
      };

      let receiptHTML = `
        <div style="text-align: center; font-family: monospace;">
          <h3>═════════════════════════════</h3>
          <h2>ศูนย์แต่งรถ 🚗</h2>
          <p>ใบเสร็จรับเงิน</p>
          <p>วันที่: ${new Date().toLocaleDateString('th-TH', {year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'})}</p>
          <h3>═════════════════════════════</h3>

          <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
            <tr style="border-bottom: 1px solid #000;">
              <th style="text-align: left; padding: 5px;">รายการ</th>
              <th style="text-align: right; padding: 5px;">จำนวน</th>
              <th style="text-align: right; padding: 5px;">ราคา</th>
              <th style="text-align: right; padding: 5px;">รวม</th>
            </tr>
      `;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        receiptHTML += `
          <tr style="border-bottom: 1px dashed #ccc;">
            <td style="text-align: left; padding: 5px;">${item.name}</td>
            <td style="text-align: right; padding: 5px;">${item.quantity}</td>
            <td style="text-align: right; padding: 5px;">${formatCurrency(item.price)}</td>
            <td style="text-align: right; padding: 5px;">${formatCurrency(itemTotal)}</td>
          </tr>
        `;
      });

      receiptHTML += `
          </table>

          <div style="text-align: right; padding: 10px 0;">
            <p>รวม: ${formatCurrency(subtotal)}</p>
            ${discount > 0 ? `<p>ส่วนลด: ${formatCurrency(discount)}</p>` : ''}
            <h3 style="border-top: 2px solid #000; padding-top: 10px;">รวมทั้งสิ้น: ${formatCurrency(total)}</h3>
          </div>

          <div style="text-align: center; margin: 20px 0;">
            <img src="${generateQRCode(qrData)}" alt="QR Code" style="width: 150px; height: 150px;">
            <p style="font-size: 12px; margin-top: 10px;">ขอบคุณที่ใช้บริการ ยินดีต้อนรับกลับมา</p>
          </div>

          <h3>═════════════════════════════</h3>
        </div>
      `;

      document.getElementById('receiptContent').innerHTML = receiptHTML;
      document.getElementById('receiptModal').style.display = 'block';

      // บันทึกรายการขายลง store (แดชบอร์ด/รายงานจะเห็นทันที)
      addSale({
        items: saleItems,
        subtotal: subtotal,
        discount: discount,
        total: total,
        payment: document.getElementById('paymentMethod').value,
        customer: document.getElementById('customerName').value || 'ลูกค้าทั่วไป',
        date: new Date().toISOString()
      });

      // เคลียร์ตะกร้าและรีเฟรชสต็อกในหน้าจอ
      cart = [];
      document.getElementById('discount').value = 0;
      document.getElementById('customerName').value = '';
      updateCart();
      loadProducts();

      showNotification('✅ บันทึกการขายและตัดสต็อกเรียบร้อย', 'success');
    }

    function generatePO() {
      if (cart.length === 0) {
        showNotification('⚠️ ยังไม่มีสินค้าในรายการ', 'warning');
        return;
      }

      let poHTML = '<div style="padding: 20px; font-family: monospace; text-align: center;">';
      poHTML += '<h2>📋 ใบสั่งซื้อ</h2>';
      poHTML += '<p>วันที่: ' + new Date().toLocaleDateString('th-TH') + '</p>';
      poHTML += '<table style="width: 100%; border-collapse: collapse; margin: 20px 0;">';
      poHTML += '<tr><th>รายการ</th><th>จำนวน</th><th>ราคา</th></tr>';

      cart.forEach(item => {
        poHTML += `<tr>
          <td>${item.name}</td>
          <td>${item.quantity}</td>
          <td>${formatCurrency(item.price * item.quantity)}</td>
        </tr>`;
      });

      poHTML += '</table></div>';

      document.getElementById('receiptContent').innerHTML = poHTML;
      document.getElementById('receiptModal').style.display = 'block';
    }

    function printReceipt() {
      const printWindow = window.open('', '', 'width=800,height=600');
      printWindow.document.write(document.getElementById('receiptContent').innerHTML);
      printWindow.document.close();
      printWindow.print();
    }

    function downloadReceipt() {
      const qrImage = document.querySelector('#receiptContent img');
      if (qrImage) {
        const link = document.createElement('a');
        link.href = qrImage.src;
        link.download = 'receipt_qr.png';
        link.click();
        showNotification('✅ ดาวน์โหลด QR สำเร็จ', 'success');
      }
    }

    function clearCart() {
      if (confirm('ต้องการล้างรายการหรือไม่?')) {
        cart = [];
        updateCart();
        document.getElementById('discount').value = 0;
        document.getElementById('customerName').value = '';
        showNotification('✅ ล้างรายการเรียบร้อย', 'success');
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    loadProducts();
  </script>
</body>
</html>
