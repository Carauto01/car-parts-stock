<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสต็อก - ศูนย์แต่งรถ</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <button class="icon-btn" data-theme-toggle onclick="toggleTheme()"
    style="position: fixed; top: 16px; right: 16px; z-index: 10;">☀️</button>

  <div class="login-container">
    <div class="login-card">
      <h1>🚗 ศูนย์แต่งรถ</h1>
      <h3 style="text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 16px;">ระบบจัดการสต็อก</h3>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">ชื่อผู้ใช้</label>
          <input type="text" id="username" name="username" required placeholder="admin">
        </div>

        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <div id="errorMsg" class="alert alert-error" style="display: none;"></div>

        <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border);">

        <p style="text-align: center; font-size: 12px; color: var(--text-faint);">
          📝 สำหรับการทดสอบแรก<br>
          Username: <strong>admin</strong><br>
          Password: <strong>admin123</strong>
        </p>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      // ชั่วคราวใช้ localStorage (เพื่อ demo) จนกว่า Supabase auth setup
      // ผู้ใช้มาจาก js/store.js — แก้ไขได้ที่หน้า "ผู้ใช้งาน"
      const user = findUserByLogin(username, password);

      if (user) {
        saveLocalUser({
          id: user.id,
          username: user.username,
          name: user.name,
          role: user.role,
          permissions: user.permissions || []
        });
        
        currentUser = getLocalUser();
        userRole = currentUser.role;
        
        showNotification(`ยินดีต้อนรับ ${user.name}`, 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      } else {
        errorMsg.textContent = '❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
        errorMsg.style.display = 'block';
      }
    });

    // ตรวจสอบว่าล็อกอินอยู่แล้ว
    if (getLocalUser()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
